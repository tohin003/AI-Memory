<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gemini Mock Interface</title>
    <script src="utils/mock-chrome.js"></script>
    <style>
        body {
            font-family: Roboto, sans-serif;
            background: #f0f4f9;
            padding: 20px;
        }

        .conversation-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            min-height: 500px;
        }

        .user-query-text {
            background: #e8f0fe;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            display: block;
        }

        .model-response-text {
            background: #f1f3f4;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            display: block;
        }

        .input-area {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <div class="conversation-container">
        <h1>Gemini (Mock)</h1>
        <div id="chat-history">
            <!-- Chat content will go here -->
        </div>

        <div class="input-area">
            <input type="text" id="prompt-input" placeholder="Enter a prompt here">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // Simulate Gemini's behavior
        const chatHistory = document.getElementById('chat-history');
        const input = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');

        sendBtn.addEventListener('click', () => {
            const text = input.value;
            if (!text) return;

            // Add User Query
            const userDiv = document.createElement('div');
            userDiv.className = 'user-query-text'; // Class targeted by scraper
            userDiv.innerText = text;
            chatHistory.appendChild(userDiv);
            input.value = '';

            // Simulate AI Response delay
            setTimeout(() => {
                const modelDiv = document.createElement('div');
                modelDiv.className = 'model-response-text'; // Class targeted by scraper
                modelDiv.innerText = "This is a simulated response about " + text + ". RAG (Retrieval-Augmented Generation) combines retrieval of relevant documents with text generation.";
                chatHistory.appendChild(modelDiv);
            }, 1000);
        });
    </script>
</body>

</html>
