<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Memory - Login</title>
    <link rel="stylesheet" href="../sidebar/sidebar.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .auth-container {
            width: 85%;
            max-width: 320px;
            padding: 2rem;
            text-align: center;
            background: rgba(245, 245, 220, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            max-height: 90vh;
            overflow-y: auto;
        }

        h2 {
            color: #5d4037;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.6);
            color: #3e2723;
            outline: none;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #8d6e63;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 1rem;
            background: #8d6e63;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #6d4c41;
        }

        button:disabled {
            background: #bcaaa4;
            cursor: not-allowed;
        }

        .toggle-link {
            display: block;
            margin-top: 1rem;
            color: #5d4037;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .error {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .hidden {
            display: none;
        }

        .otp-group {
            display: flex;
            gap: 5px;
        }

        #send-otp-btn {
            margin-top: 6px;
            width: auto;
            padding: 10px 15px;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h2 id="auth-title">Welcome Back</h2>
        <form id="auth-form">
            <!-- Login Fields -->
            <input type="email" id="email" placeholder="Email Address" required>

            <!-- Signup Fields -->
            <div id="signup-fields" class="hidden">
                <input type="text" id="name" placeholder="Full Name">
                <div class="otp-group">
                    <input type="text" id="otp" placeholder="Enter OTP">
                    <button type="button" id="send-otp-btn">Send OTP</button>
                </div>
            </div>

            <input type="password" id="password" placeholder="Password" required>

            <div id="signup-fields-2" class="hidden">
                <input type="password" id="confirm-password" placeholder="Confirm Password">
            </div>

            <button type="submit" id="submit-btn">Login</button>
        </form>
        <div id="error-msg" class="error"></div>
        <span class="toggle-link" id="toggle-mode">Need an account? Sign Up</span>
    </div>
    <script src="auth.js"></script>
</body>

</html>
